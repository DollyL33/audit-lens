  <!-- lens -->
  <circle cx="27" cy="27" r="17" fill="#132238" stroke="#5fbf8f" stroke-width="4"/>
  <!-- mini Benford chart: bars fall away, one burgundy spike -->
  <rect x="16" y="22" width="4" height="13" rx="1" fill="#9fb0c6"/>
  <rect x="21.5" y="26" width="4" height="9" rx="1" fill="#9fb0c6"/>
  <rect x="27" y="18" width="4" height="17" rx="1" fill="#c4475c"/>
  <rect x="32.5" y="30" width="4" height="5" rx="1" fill="#9fb0c6"/>
  <!-- handle -->
  <line x1="40" y1="40" x2="52" y2="52" stroke="#5fbf8f" stroke-width="6" stroke-linecap="round"/>
</svg>
