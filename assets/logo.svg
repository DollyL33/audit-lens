<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Audit Lens logo">
  <rect width="64" height="64" rx="14" fill="#152036"/>
  <!-- lens -->
  <circle cx="27" cy="27" r="17" fill="#0b1220" stroke="#4ade80" stroke-width="4"/>
  <!-- mini Benford chart: bars fall away, one orange spike -->
  <rect x="16" y="22" width="4" height="13" rx="1" fill="#93a0b4"/>
  <rect x="21.5" y="26" width="4" height="9" rx="1" fill="#93a0b4"/>
  <rect x="27" y="18" width="4" height="17" rx="1" fill="#f59e5b"/>
  <rect x="32.5" y="30" width="4" height="5" rx="1" fill="#93a0b4"/>
  <!-- handle -->
  <line x1="40" y1="40" x2="52" y2="52" stroke="#4ade80" stroke-width="6" stroke-linecap="round"/>
</svg>
